<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Pokémon Collection</title>
        <meta name="description" content="Pokémon merchandise collection catalogue" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="canonical" href="https://yanni-xoxo.github.io/pkmncollection/" />
        <link rel="icon" href="../icon.ico" type="image/x-icon" />
        <script src="../theme.js"></script>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="stylesheet" href="../styles.css" />
    </head>
    <body>
        <header class="topbar no-print" role="banner">
            <div class="brand-group">
                <a class="brand-link" href="./">
                    <p class="eyebrow">Pokémon</p>
                    <h1 class="brand-title">Collection</h1>
                </a>
            </div>
            <nav class="top-links" aria-label="Page actions">
                <button
                    type="button"
                    class="header-btn header-icon-btn"
                    id="themeToggle"
                    aria-label="Switch to dark mode"
                    title="Switch to dark mode"
                >
                    <i class="fa-solid fa-moon" aria-hidden="true"></i>
                </button>
            </nav>
        </header>

        <main class="page about-page jp-page page-animate" id="main-content">
            <section class="jp-intro" aria-labelledby="jp-heading">
                <h2 id="jp-heading">Pokémon collection</h2>
                <p class="section-note" id="jp-status" aria-live="polite">Loading catalogue…</p>
            </section>

            <section class="jp-controls" aria-label="Search and filter">
                <div id="jp-toolbar"></div>
            </section>

            <section class="jp-catalogue" aria-label="Merchandise catalogue">
                <div id="jp-grid" aria-busy="true">Loading…</div>
            </section>
        </main>

        <footer class="footer-note no-print">© 2026</footer>
        <script src="../script.js"></script>
        <script src="collection.js"></script>
    </body>
</html>
